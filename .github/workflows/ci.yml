# CI: every pull request and every push is checked before it can go live.
# Validation errors appear as inline comments on the exact file that broke the rules.
name: Check content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate content (fields, links, references, dates)
        run: python -m hub validate
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python -m hub build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test the Scaffold Advisor against real job scenarios
        run: node tests/advisor.test.js
      - name: Upload preview of the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist/
          retention-days: 7
